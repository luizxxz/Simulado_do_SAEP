<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SAEP</div>
        <a href="index.html">Voltar ao Quadro</a>
    </nav>

    <div class="container-form">
        <div class="card-form">
            <h2>Novo Usuario</h2>
            <form id="formUser">
                <label>Nome do Colaborador:</label>
                <input type="text" id="nome" placeholder="digite o nome completo" required>
                
                <label>E-mail:</label>
                <input type="email" id="email" placeholder="email@empresa.com" required>
                
                <button type="submit" class="btn-submit">Salvar usuario</button>
            </form>
            <p id="msg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        document.getElementById('formUser').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value
            };

            const res = await fetch('http://localhost:3000/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const msgElement = document.getElementById('msg');
            if(res.ok) {
                msgElement.innerText = "Usuario salvo";
                msgElement.style.color = "green";
                e.target.reset();
            } else {
                msgElement.innerText = "erro ao Salvar.";
                msgElement.style.color = "red";
            }
        };
    </script>
</body>
</html>
